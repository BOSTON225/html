<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة ساهر - حجر ورقة مقص</title>
    <style>
        body { background: #0d1117; color: white; text-align: center; font-family: Arial; padding-top: 50px; margin: 0; }
        .game-card { background: #161b22; padding: 30px; border-radius: 20px; border: 2px solid #ff0000; display: inline-block; }
        h1 { color: #ff0000; }
        .btn { background: #30363d; border: 1px solid #ff0000; color: white; padding: 15px; font-size: 30px; border-radius: 10px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #ff0000; }
        #res { font-size: 20px; margin-top: 20px; color: #00ff00; font-weight: bold; }
        .score { margin-top: 15px; color: #aaa; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>ساهر 🆚 الكمبيوتر</h1>
        <p>اختار حركتك:</p>
        <button class="btn" onclick="play('حجر')">🪨</button>
        <button class="btn" onclick="play('ورقة')">📄</button>
        <button class="btn" onclick="play('مقص')">✂️</button>
        
        <div id="res">مستني اختيارك..</div>
        <div class="score">أنت: <span id="u-s">0</span> | هو: <span id="c-s">0</span></div>
    </div>

    <script>
        let u = 0, c = 0;
        function play(user) {
            const options = ['حجر', 'ورقة', 'مقص'];
            const comp = options[Math.floor(Math.random() * 3)];
            let result = "";

            if (user === comp) { result = "تعادل! 🤝"; }
            else if ((user === 'حجر' && comp === 'مقص') || (user === 'ورقة' && comp === 'حجر') || (user === 'مقص' && comp === 'ورقة')) {
                result = "كسبت يا وحش! 🔥"; u++;
            } else {
                result = "الكمبيوتر كسب! 🤖"; c++;
            }
            document.getElementById('res').innerText = `إنت: ${user} | هو: ${comp} \n ${result}`;
            document.getElementById('u-s').innerText = u;
            document.getElementById('c-s').innerText = c;
        }
    </script>
</body>
</html>
